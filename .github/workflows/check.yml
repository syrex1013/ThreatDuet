name: check
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Live task on this OS (model, Mac/PC tools, permission file)
        run: bunx tsx scripts/smoke-task.mts
      - name: Desktop app starts and draws its window
        run: bun run build && bunx electron . --no-sandbox
        env:
          THREATDUET_SMOKE_SCREENSHOT: ${{ runner.temp }}/window.png
      - uses: actions/upload-artifact@v4
        with:
          name: window-${{ matrix.os }}
          path: ${{ runner.temp }}/window.png
